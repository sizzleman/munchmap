name: Refresh OpenStreetMap snapshots
# Weekly: re-extract restaurants around each campus/city so the map loads instantly
# even when public Overpass servers are slow. Output stays ODbL (public/osm/LICENSE.md).
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: osm-snapshot, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run snapshot:osm
      - name: Commit snapshots
        run: |
          git config user.name "munchmap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/osm
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -s -m "data: refresh OpenStreetMap snapshots"
          git pull --rebase origin main
          git push
